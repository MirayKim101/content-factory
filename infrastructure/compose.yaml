name: content-factory

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      # PostgreSQL 18 stores clusters under a version-specific directory.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - content-factory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - content-factory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning --user default --pass "$$REDIS_PASSWORD" ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: content-factory-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
      args:
        GO_IMAGE: golang:1.24.8-bookworm
        RUNTIME_IMAGE: debian:12.12-slim
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - content-factory
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    image: content-factory-minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    entrypoint: ["/bin/sh", "/provision"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env and set MINIO_ROOT_PASSWORD}
      S3_SOURCE_BUCKET: ${S3_SOURCE_BUCKET:-content-factory-sources}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?copy .env.example to .env and set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?copy .env.example to .env and set S3_SECRET_KEY}
    volumes:
      - ./minio/provision:/provision:ro
    networks:
      - content-factory
    depends_on:
      minio:
        condition: service_healthy

  worker:
    image: content-factory-worker:node24.15.0-ffmpeg5.1.9
    build:
      context: ..
      dockerfile: infrastructure/worker/Dockerfile
    profiles: ["worker"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SOURCE_BUCKET: ${S3_SOURCE_BUCKET:-content-factory-sources}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?copy .env.example to .env and set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?copy .env.example to .env and set S3_SECRET_KEY}
      S3_OPERATION_TIMEOUT_MS: ${S3_OPERATION_TIMEOUT_MS:-7200000}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      MEDIA_PROCESS_TIMEOUT_MS: ${MEDIA_PROCESS_TIMEOUT_MS:-7200000}
      WORKER_SCRATCH_DIRECTORY: /var/lib/content-factory-worker
      WORKER_SCRATCH_MAX_BYTES: ${WORKER_SCRATCH_MAX_BYTES:-21474836480}
      WORKER_HEAVY_CONCURRENCY: ${WORKER_HEAVY_CONCURRENCY:-1}
      CUT_LEASE_MS: ${CUT_LEASE_MS:-120000}
      CUT_HEARTBEAT_MS: ${CUT_HEARTBEAT_MS:-30000}
      CUT_RECONCILE_INTERVAL_MS: ${CUT_RECONCILE_INTERVAL_MS:-5000}
      CUT_SCRATCH_SAFETY_BYTES: ${CUT_SCRATCH_SAFETY_BYTES:-536870912}
    volumes:
      - worker-scratch:/var/lib/content-factory-worker
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    networks:
      - content-factory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/var/lib/content-factory-worker/worker-ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  content-factory:
    name: content-factory

volumes:
  postgres-data:
  redis-data:
  minio-data:
  worker-scratch:
