name: content-factory

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      # PostgreSQL 18 stores clusters under a version-specific directory.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - content-factory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - content-factory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning --user default --pass "$$REDIS_PASSWORD" ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: content-factory-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
      args:
        GO_IMAGE: golang:1.24.8-bookworm
        RUNTIME_IMAGE: debian:12.12-slim
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - content-factory
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    image: content-factory-minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    entrypoint: ["/bin/sh", "/provision"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env and set MINIO_ROOT_PASSWORD}
      S3_SOURCE_BUCKET: ${S3_SOURCE_BUCKET:-content-factory-sources}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?copy .env.example to .env and set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?copy .env.example to .env and set S3_SECRET_KEY}
    volumes:
      - ./minio/provision:/provision:ro
    networks:
      - content-factory
    depends_on:
      minio:
        condition: service_healthy

  media-worker:
    image: content-factory-media-worker:0.0.0-stage1
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 2.0
    stop_grace_period: 45s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env and set REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SOURCE_BUCKET: ${S3_SOURCE_BUCKET:-content-factory-sources}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?copy .env.example to .env and set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?copy .env.example to .env and set S3_SECRET_KEY}
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-1}
      MEDIA_JOB_LEASE_MS: ${MEDIA_JOB_LEASE_MS:-30000}
      MEDIA_JOB_TIMEOUT_MS: ${MEDIA_JOB_TIMEOUT_MS:-7200000}
      MEDIA_SCRATCH_DIRECTORY: /tmp/media-worker
      MEDIA_SCRATCH_SAFETY_MIB: ${MEDIA_SCRATCH_SAFETY_MIB:-1024}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000,size=${MEDIA_SCRATCH_SIZE:-24g}
    networks:
      - content-factory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/content-factory-media-worker-healthcheck.mjs",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  content-factory:
    name: content-factory

volumes:
  postgres-data:
  redis-data:
  minio-data:
